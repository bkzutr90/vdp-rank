server:
  port: 2333
  address: 0.0.0.0
lavalink:
  plugins:
    # cek versi terbaru di https://github.com/lavalink-devs/youtube-source/releases
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.13.3"
      snapshot: false
  server:
    password: "bkzutr9090"   # samakan dengan LAVALINK_PASSWORD di bot
    sources:
      youtube: false              # dimatikan, diganti plugin youtube-source
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    playerUpdateInterval: 5
    gc-warnings: true
plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - WEB
      - TVHTML5EMBEDDED
      - ANDROID_VR
    # Kalau muncul "Sign in to confirm you're not a bot", isi salah satu:
    # oauth:
    #   enabled: true
    # pot:
    #   token: "ISI_PO_TOKEN"
    #   visitorData: "ISI_VISITOR_DATA"
logging:
  level:
    root: INFO
    lavalink: INFO
